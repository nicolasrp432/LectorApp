
<!DOCTYPE html>
<html lang="es" class="dark scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Lector - Inteligencia Artificial aplicada a la lectura rápida y supermemoria." />
    <meta name="theme-color" content="#0c1410" />
    <title>Lector - Coach de Aprendizaje</title>
    <script>
      window.global = window;
      window.process = { 
        env: { NODE_ENV: 'production', API_KEY: '' },
        cwd: () => '/',
        platform: 'browser',
        nextTick: (fn) => setTimeout(fn, 0)
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "var(--primary)",
              "primary-dark": "var(--primary-dark)",
              "primary-muted": "var(--primary-muted)",
              "background-dark": "var(--bg-dark)",
              "background-light": "var(--bg-light)",
              "surface-dark": "var(--surface-dark)",
              "card-border": "var(--card-border)",
            },
            fontFamily: { display: ["Lexend", "sans-serif"] },
            borderRadius: {
              '4xl': '2rem',
            },
            boxShadow: {
              'glow': '0 0 20px var(--primary-glow)',
              'glow-lg': '0 0 40px var(--primary-glow)',
              'card': '0 1px 3px rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.15)',
              'card-hover': '0 2px 6px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.2)',
            },
          },
        },
      };
    </script>
    <style>
      :root { 
        /* Paleta verde sofisticada - tonos desaturados y profundos */
        --primary: #34d399;
        --primary-dark: #10b981;
        --primary-muted: rgba(52, 211, 153, 0.08);
        --primary-glow: rgba(52, 211, 153, 0.15);

        /* Fondos oscuros - más neutros, menos verde puro */
        --bg-dark: #0c1410;
        --bg-light: #f8faf9;
        --surface-dark: #141e19;
        --card-border: rgba(255, 255, 255, 0.06);
      }

      body { 
        background-color: var(--bg-dark); 
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Transiciones fluidas globales */
      *, *::before, *::after {
        transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      }

      /* Eliminar transicion en animaciones rapidas */
      .animate-spin, .animate-pulse, .animate-ping, .animate-bounce {
        transition: none !important;
      }

      /* Selection refinada */
      ::selection {
        background: var(--primary);
        color: var(--bg-dark);
      }

      /* Focus ring global consistente */
      *:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      /* Scrollbar sutil para navegadores que la muestran */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

      /* ========================================
         LECTO MASCOT ANIMATIONS
         ======================================== */

      /* Idle: gentle float + blink */
      .lecto-idle .lecto-body {
        animation: lectoFloat 3s ease-in-out infinite;
      }
      .lecto-idle .lecto-pupil {
        animation: lectoBlink 4s ease-in-out infinite;
      }
      .lecto-idle .lecto-page-right {
        animation: lectoPageRuffle 4s ease-in-out infinite;
      }

      /* Happy: bounce + page flutter */
      .lecto-happy .lecto-body {
        animation: lectoBounce 1.5s ease-in-out infinite;
      }
      .lecto-happy .lecto-page-left {
        animation: lectoPageFlutter 0.6s ease-in-out infinite alternate;
      }
      .lecto-happy .lecto-page-right {
        animation: lectoPageFlutter 0.6s ease-in-out 0.1s infinite alternate;
      }
      .lecto-happy .lecto-happy-extras {
        animation: lectoHeartFloat 2s ease-in-out infinite;
      }

      /* Thinking: tilt + question pulse */
      .lecto-thinking .lecto-body {
        animation: lectoThink 3s ease-in-out infinite;
      }
      .lecto-thinking .lecto-question {
        animation: lectoQuestionPulse 2s ease-in-out infinite;
      }

      /* Celebrating: big bounce + sparkles */
      .lecto-celebrating .lecto-body {
        animation: lectoCelebrate 1s ease-in-out infinite;
      }
      .lecto-celebrating .lecto-sparkle-1 { animation: lectoSparkle 1.2s ease-out infinite 0s; }
      .lecto-celebrating .lecto-sparkle-2 { animation: lectoSparkle 1.2s ease-out infinite 0.2s; }
      .lecto-celebrating .lecto-sparkle-3 { animation: lectoSparkle 1.2s ease-out infinite 0.4s; }
      .lecto-celebrating .lecto-sparkle-4 { animation: lectoSparkle 1.2s ease-out infinite 0.6s; }
      .lecto-celebrating .lecto-sparkle-5 { animation: lectoSparkle 1.2s ease-out infinite 0.8s; }
      .lecto-celebrating .lecto-sparkle-6 { animation: lectoSparkle 1.2s ease-out infinite 1.0s; }
      .lecto-celebrating .lecto-star-1,
      .lecto-celebrating .lecto-star-2 {
        animation: lectoStarSpin 1s linear infinite;
      }

      /* Sad: slight droop */
      .lecto-sad .lecto-body {
        animation: lectoSad 3s ease-in-out infinite;
      }

      /* Sleeping: gentle sway + zzz */
      .lecto-sleeping .lecto-body {
        animation: lectoSleep 4s ease-in-out infinite;
      }
      .lecto-sleeping .lecto-zzz {
        animation: lectoZzz 2s ease-in-out infinite;
      }
      .lecto-sleeping .lecto-zzz-2 {
        animation: lectoZzz 2s ease-in-out infinite 0.5s;
      }

      /* Speech bubble entrance */
      .lecto-bubble-enter {
        animation: lectoBubbleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* --- Keyframes --- */

      @keyframes lectoFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      @keyframes lectoBlink {
        0%, 42%, 46%, 100% { r: 2.5; }
        44% { r: 0.3; }
      }

      @keyframes lectoPageRuffle {
        0%, 100% { transform: skewY(0deg); }
        50% { transform: skewY(-1deg); }
      }

      @keyframes lectoBounce {
        0%, 100% { transform: translateY(0) scale(1); }
        40% { transform: translateY(-6px) scale(1.03); }
        60% { transform: translateY(-2px) scale(0.98); }
      }

      @keyframes lectoPageFlutter {
        0% { transform: skewY(0deg); }
        100% { transform: skewY(-3deg); }
      }

      @keyframes lectoHeartFloat {
        0%, 100% { transform: translateY(0); opacity: 0.7; }
        50% { transform: translateY(-6px); opacity: 1; }
      }

      @keyframes lectoThink {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-3deg); }
        75% { transform: rotate(3deg); }
      }

      @keyframes lectoQuestionPulse {
        0%, 100% { opacity: 0.3; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-4px); }
      }

      @keyframes lectoCelebrate {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-8px) rotate(-4deg); }
        50% { transform: translateY(-3px) rotate(0deg); }
        75% { transform: translateY(-8px) rotate(4deg); }
      }

      @keyframes lectoSparkle {
        0% { opacity: 1; r: 2; }
        50% { opacity: 0.8; r: 3.5; }
        100% { opacity: 0; r: 0.5; }
      }

      @keyframes lectoStarSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes lectoSad {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(2px) rotate(-2deg); }
      }

      @keyframes lectoSleep {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(1px) rotate(-1.5deg); }
      }

      @keyframes lectoZzz {
        0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
        50% { opacity: 0.8; transform: translate(-4px, -8px) scale(1); }
        100% { opacity: 0; transform: translate(-8px, -16px) scale(0.7); }
      }

      @keyframes lectoBubbleIn {
        0% { opacity: 0; transform: scale(0.8) translateY(8px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
    </style>

</script>
